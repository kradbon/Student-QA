<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Q&A — макеты лабораторной 9</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#212529;font:16px/1.5 "Noto Sans",Arial,sans-serif}a{color:#0d6efd;text-decoration:none}.top{height:72px;background:#fff;border-bottom:1px solid #dee2e6;display:flex;align-items:center;padding:0 max(calc((100% - 1240px)/2),32px);gap:36px}.brand{font-weight:800;font-size:20px;color:#172554}.brand b{color:#0d6efd}.nav{display:flex;gap:26px;color:#495057}.nav a{color:inherit}.right{margin-left:auto;color:#6c757d}.wrap{max-width:1240px;margin:38px auto;padding:0 20px}.crumb{font-size:14px;color:#6c757d;margin-bottom:16px}.hero{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}h1{font-size:32px;line-height:1.25;margin:0 0 6px;font-weight:750;letter-spacing:-.5px}h2{font-size:22px;margin:0 0 18px}.muted{color:#6c757d}.btn{height:44px;border:0;border-radius:7px;padding:0 17px;background:#0d6efd;color:white;font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.secondary{background:#fff;color:#343a40;border:1px solid #dee2e6}.btn.ghost{background:#eef4ff;color:#0d6efd}.layout{display:grid;grid-template-columns:260px 1fr;gap:22px}.panel,.card{background:#fff;border:1px solid #e3e7ed;border-radius:12px;box-shadow:0 2px 8px #1f293708}.panel{padding:20px}.filter{padding:17px 0;border-bottom:1px solid #edf0f4}.filter:last-child{border:0}.filter strong{display:block;margin-bottom:10px}.check{display:flex;align-items:center;gap:9px;color:#495057;margin:8px 0;font-size:14px}.check i{width:17px;height:17px;border:1px solid #c7ced8;border-radius:4px}.search{height:46px;border:1px solid #dee2e6;border-radius:8px;background:white;display:flex;align-items:center;padding:0 14px;color:#89919b;flex:1}.toolbar{display:flex;gap:12px;margin-bottom:16px}.question{padding:20px 22px;margin-bottom:12px;display:grid;grid-template-columns:56px 1fr;gap:18px}.votes{background:#f5f8fc;border-radius:9px;text-align:center;padding:9px 4px;font-weight:700;color:#344054}.votes small{display:block;font-size:11px;color:#7b8491;font-weight:500}.qtitle{font-size:18px;font-weight:700;color:#1d4ed8;margin:0 0 6px}.desc{color:#5c6675;margin:0 0 14px}.tags{display:flex;gap:7px}.tag{padding:4px 10px;border-radius:20px;background:#eef4ff;color:#2458a6;font-size:12px;font-weight:600}.meta{display:flex;gap:14px;font-size:13px;color:#747d89;margin-top:13px}.two{display:grid;grid-template-columns:1fr 300px;gap:20px}.answer{padding:22px;margin-top:14px}.answerText{font-size:16px;line-height:1.75}.accepted{color:#198754;font-size:14px;font-weight:700}.field{margin:15px 0}.field label{display:block;font-size:14px;font-weight:650;margin-bottom:6px}.input{height:46px;border:1px solid #dee2e6;border-radius:7px;background:white;padding:11px 13px;color:#6c757d}.textarea{height:150px}.stats{display:flex;gap:12px;margin:18px 0}.stat{padding:14px 16px;background:#f7f9fc;border-radius:9px;min-width:100px}.stat b{display:block;font-size:21px}.profile{display:flex;gap:16px;align-items:center}.avatar{width:64px;height:64px;border-radius:50%;background:#dbeafe;color:#1d4ed8;font-size:20px;font-weight:700;display:grid;place-items:center}.badge{background:#e5f5ec;color:#167345;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700}.formcard{max-width:470px;margin:40px auto;padding:34px}.logo{font-size:25px;font-weight:800;margin-bottom:25px}.notice{padding:14px 16px;border:1px solid #b7e4c7;border-radius:8px;background:#effaf3;color:#176b3a;margin-top:15px}.pages{display:flex;justify-content:center;gap:8px;margin:24px}.page{width:38px;height:38px;border-radius:7px;background:white;border:1px solid #dee2e6;display:grid;place-items:center}.page.active{background:#0d6efd;color:white}.mobile{max-width:390px;min-height:844px;margin:30px auto;background:#f4f6fa;border:8px solid #202938;border-radius:28px;overflow:hidden}.mobile .top{height:58px;padding:0 15px;gap:12px}.mobile .nav{display:none}.mobile .wrap{margin:22px auto;padding:0 15px}.mobile h1{font-size:25px}.mobile .layout{display:flex;flex-direction:column;gap:12px}.mobile .panel{padding:12px 16px}.mobile .filter{padding:7px 0}.mobile .filter .check{display:none}.mobile .question{padding:15px;grid-template-columns:43px 1fr;gap:12px}.mobile .qtitle{font-size:16px}.mobile .desc{font-size:14px}.mobile .two{display:block}.mobile .toolbar{flex-wrap:wrap}.mobile .toolbar .search{flex-basis:100%}
</style></head><body><div id="app"></div><script>
const nav='<header class="top"><div class="brand">Q<b>&</b>A</div><nav class="nav"><a href="?screen=questions">Вопросы</a><a href="?screen=tags">Теги</a><a href="?screen=community">Сообщество</a></nav><span class="right">⌕　 RU　　Алина С.</span></header>';
const question=(n,title,desc,tags,answers,time)=>`<article class="card question"><div class="votes">${n}<small>голосов</small></div><div><a class="qtitle" href="?screen=detail">${title}</a><p class="desc">${desc}</p><div class="tags">${tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="meta"><span>◉ ${answers} ответа</span><span>♡ ${time}</span><span>Илья М.</span></div></div></article>`;
const shell=(content)=>nav+`<main class="wrap">${content}</main>`;
const list=()=>shell(`<div class="hero"><div><div class="crumb">Главная / Вопросы</div><h1>Вопросы сообщества</h1><span class="muted">Найдите ответ или поделитесь знаниями</span></div><a class="btn" href="?screen=create">＋　Задать вопрос</a></div><div class="layout"><aside class="panel"><h2>Фильтры</h2><div class="filter"><strong>Сортировка</strong><div class="check">◉　Новые</div><div class="check">◯　Популярные</div><div class="check">◯　Без ответа</div></div><div class="filter"><strong>Категории</strong><div class="check">☑　Программирование</div><div class="check">□　Базы данных</div><div class="check">□　Веб-разработка</div></div><div class="filter"><strong>Статус</strong><div class="check">□　Открытые</div><div class="check">□　Решённые</div></div></aside><section><div class="toolbar"><div class="search">⌕　 Поиск по вопросам...</div><button class="btn secondary">Фильтры</button></div>${question(12,'Почему асинхронная функция возвращает Promise?','Разбираюсь с async/await в JavaScript. Почему результат функции нужно получать через await?',['javascript','async/await'],3,'12 мин назад')}${question(8,'Как оптимизировать SQL-запрос с несколькими JOIN?','Запрос стал медленно работать на таблице с большим количеством записей.',['sql','база данных'],2,'34 мин назад')}${question(5,'В чём разница между Flexbox и CSS Grid?','Для адаптивной сетки карточек лучше использовать Grid или Flexbox?',['css','вёрстка'],0,'1 час назад')}<div class="pages"><span class="page active">1</span><span class="page">2</span><span class="page">3</span><span class="page">→</span></div></section></div>`);
const detail=()=>shell(`<div class="crumb">Вопросы　/　JavaScript</div><div class="two"><section><div class="card" style="padding:24px"><div class="meta">ЗАДАН ВЧЕРА　 ·　 246 просмотров</div><h1 style="font-size:27px;margin:12px 0">Почему асинхронная функция возвращает Promise?</h1><div class="tags"><span class="tag">javascript</span><span class="tag">async/await</span></div><p class="answerText">Разбираюсь с async/await в JavaScript. Почему результат функции нужно получать через await? Я ожидал, что функция вернёт готовое значение.</p><div class="meta">Илья М. · студент　　♡ 12　　↗ Поделиться</div></div><div class="card answer"><div class="accepted">✓　Принятый ответ</div><p class="answerText">Функция, объявленная с ключевым словом <b>async</b>, всегда возвращает Promise. Это позволяет использовать await внутри неё и удобно обрабатывать результат асинхронных операций. Чтобы получить значение, вызовите её с await или используйте .then().</p><div class="meta">✓　Мария К. · 2 часа назад　　♡ 18</div></div><div class="card answer"><h2>Ваш ответ</h2><div class="input textarea">Напишите понятный и полезный ответ…</div><button class="btn">Опубликовать ответ</button></div></section><aside><div class="panel"><h2>Об авторе</h2><div class="profile"><div class="avatar">ИС</div><div><b>Илья Смирнов</b><div class="muted">Студент · 120 баллов</div></div></div><div class="stats"><div class="stat"><b>14</b><small>вопросов</small></div><div class="stat"><b>8</b><small>ответов</small></div></div><button class="btn secondary" style="width:100%">Задать вопрос</button></div><div class="panel" style="margin-top:16px"><h2>Похожие вопросы</h2><p><a>Как работает event loop в JavaScript?</a></p><p><a>Когда использовать Promise.all?</a></p><p><a>Обработка ошибок в async функции</a></p></div></aside></div>`);
const create=()=>shell(`<div class="crumb">Вопросы　/　Новый вопрос</div><div style="max-width:850px;margin:auto"><h1>Задайте вопрос</h1><p class="muted">Опишите проблему подробно — сообщество поможет найти решение.</p><div class="card" style="padding:28px;margin-top:22px"><div class="field"><label>Заголовок вопроса</label><div class="input">Например: Как подключить PostgreSQL к Laravel?</div><small class="muted">Кратко сформулируйте конкретную проблему</small></div><div class="field"><label>Подробное описание</label><div class="input textarea">Что вы пробовали? Что ожидали увидеть? Добавьте пример кода…</div></div><div class="field"><label>Категория</label><div class="input">Выберите категорию　⌄</div></div><div class="field"><label>Теги</label><div class="input">Введите теги через запятую</div></div><div class="field"><label>Прикрепить файл</label><div class="input">＋　Выберите файл (до 5 МБ)</div></div><div style="display:flex;gap:12px;margin-top:22px"><button class="btn">Опубликовать вопрос</button><button class="btn secondary" onclick="location.href='?screen=questions'">Отмена</button></div></div></div>`);
const login=()=>`<main class="wrap"><div class="card formcard"><div class="logo">Q<span style="color:#0d6efd">&</span>A</div><h1 style="font-size:27px">С возвращением!</h1><p class="muted">Войдите, чтобы продолжить общение</p><div class="field"><label>Электронная почта</label><div class="input">name@university.edu</div></div><div class="field"><label>Пароль</label><div class="input">Введите пароль</div></div><div style="text-align:right;margin:12px 0 20px"><a>Забыли пароль?</a></div><button class="btn" style="width:100%" onclick="location.href='?screen=questions'">Войти</button><p style="text-align:center;margin-top:20px">Нет аккаунта? <a>Зарегистрироваться</a></p><div class="notice">Безопасный вход для студентов и преподавателей</div></div></main>`;
const mobile=()=>`<div class="mobile">${list()}</div>`;
const screens={questions:list,detail,create,login,mobile};let key=new URLSearchParams(location.search).get('screen')||'questions';document.getElementById('app').innerHTML=(screens[key]||list)();
</script></body></html>
